name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: python3 -c "import json; d=json.load(open('data/components.json')); assert len(d['components'])==147, len(d['components'])"
      - run: |
          python3 server.py & SRV=$!
          sleep 1
          curl -fsS localhost:8000/health
          curl -fsS -X POST localhost:8000/mcp -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'
          kill $SRV
